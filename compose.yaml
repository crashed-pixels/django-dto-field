services:
  postgresql:
    image: postgres:16-alpine
    profiles: [postgresql]
    environment:
      POSTGRES_DB: dto_test
      POSTGRES_USER: dto_test
      POSTGRES_PASSWORD: dto_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dto_test -d dto_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: dto_test
      MYSQL_ROOT_PASSWORD: dto_test_password
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: dto_test
      MARIADB_ROOT_PASSWORD: dto_test_password
    ports:
      - "127.0.0.1:53307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
