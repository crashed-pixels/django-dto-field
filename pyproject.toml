[project]
name = "django-dto-field"
version = "1.0.0"
description = "Django model fields for storing DTO's with automatic conversion and runtime validation."
keywords = [
    "django",
    "model-field",
    "jsonfield",
    "dataclass",
    "dto",
    "serialization",
    "schema-validation",
]
authors = [{ name = "skv0zsneg", email = "klimentlamonov@yandex.ru" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Development Status :: 5 - Production",
]

dependencies = ["django>=5.2", "msgspec>=0.20.0,<0.23.0"]

[project.urls]
Homepage = "https://github.com/crashed-pixels/django-dto-field"
Documentation = "https://github.com/crashed-pixels/django-dto-field/blob/main/README.md"
Repository = "https://github.com/crashed-pixels/django-dto-field"
Issues = "https://github.com/crashed-pixels/django-dto-field/issues"
Changelog = "https://github.com/crashed-pixels/django-dto-field/blob/main/CHANGELOG.md"
Contributing = "https://github.com/crashed-pixels/django-dto-field/blob/main/CONTRIBUTING.md"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "pytest-django>=4.11.1,<5",
    "mypy>=1.15.0,<3",
    "pytest-cov>=6.1.1,<8",
    "pytest-xdist>=3.7.0,<4",
    "django-stubs[compatible-mypy]>=5.2.0,<7 ; python_version >= '3.10'",
    "ruff>=0.11.12,<0.17",
    "pytest-benchmark>=5.1.0,<6",
    "tabulate>=0.9.0,<0.11",
    "psycopg2-binary>=2.9.11,<3",
    "wemake-python-styleguide>=1.6.1,<2",
    "hypothesis>=6.100,<7",
]
mysql = ["mysqlclient>=2.2.1,<3"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.27,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_app.settings"
pythonpath = ["src", "tests/e2e"]
python_files = ["tests.py", "test_*.py"]
testpaths = ["tests"]
addopts = [
    # pytest-cov
    "--cov=src/",
    "--cov-branch",
    "--cov-report=html",
    "--cov-fail-under=100",
    # pytest-xdist
    "-n=auto",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
external = ["WPS"]

[tool.mypy]
strict = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
