[project]
name = "django-dto-field"
version = "0.1.0"
description = "Storing DTO data in easy-to-use and production-ready Django Model Field with fast [de]serialization."
authors = [{ name = "skv0zsneg", email = "<klimentlamonov@yandex.ru>" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=5.2",
    "msgspec>=0.20.0,<0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "pytest-django>=4.11.1,<5",
    "mypy>=1.15.0,<3",
    "pytest-cov>=6.1.1,<8",
    "pytest-xdist>=3.7.0,<4",
    "django-stubs[compatible-mypy]>=5.2.0,<7 ; python_version >= '3.10'",
    "ruff>=0.11.12,<0.17",
    "pytest-benchmark>=5.1.0,<6",
    "tabulate>=0.9.0,<0.11",
    "psycopg2-binary>=2.9.11,<3",
    "wemake-python-styleguide>=1.6.1,<2",
    "hypothesis>=6.100,<7",
]
mysql = ["mysqlclient>=2.2.1,<3"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.27,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_app.settings"
pythonpath = ["src", "tests/e2e"]
python_files = ["tests.py", "test_*.py"]
testpaths = ["tests"]
addopts = [
    # pytest-cov
    "--cov=src/",
    "--cov-branch",
    "--cov-report=html",
    "--cov-fail-under=100",
    # pytest-xdist
    "-n=auto",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
external = ["WPS"]

[tool.mypy]
strict = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
