[tox]
requires = tox-uv>=1.36
env_list = py314-django61-sqlite

[testenv]
description = Test Django on the selected Python and SQL backend
package = editable
deps =
    pytest>=8.3.5,<10
    pytest-django>=4.11.1,<5
    pytest-cov>=6.1.1,<7
    pytest-xdist>=3.7,<4
    hypothesis>=6.100,<7
    django42: django>=4.2,<4.3
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
    postgresql: psycopg2-binary>=2.9.11,<3
    mysql,mariadb: mysqlclient>=2.2.1,<3
    oracle: oracledb>=2.3,<4
pass_env =
    DTO_TEST_DB_HOST
    DTO_TEST_DB_PORT
    DTO_TEST_DB_NAME
    DTO_TEST_DB_USER
    DTO_TEST_DB_PASSWORD
    PKG_CONFIG_PATH
    MYSQLCLIENT_CFLAGS
    MYSQLCLIENT_LDFLAGS
set_env =
    sqlite: DTO_TEST_DB=sqlite
    postgresql: DTO_TEST_DB=postgresql
    mysql: DTO_TEST_DB=mysql
    mariadb: DTO_TEST_DB=mariadb
    oracle: DTO_TEST_DB=oracle
commands =
    sqlite: pytest -n 0 tests
    postgresql,mysql,mariadb,oracle: pytest -n 0 --no-cov tests/e2e
